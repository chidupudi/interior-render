<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interior Design System</title>
    <link rel="stylesheet" href="src/styles.css">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header class="header">
            <h1>Interior Design System</h1>
            <span class="status" id="status">Ready</span>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Left Panel: Controls -->
            <aside class="control-panel">
                <!-- Upload Section -->
                <section class="panel-section">
                    <h2>1. Upload Layout</h2>
                    <div class="upload-area" id="uploadArea">
                        <input type="file" id="layoutInput" accept=".png,.svg,.jpg,.jpeg" hidden>
                        <div class="upload-content">
                            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                                <polyline points="17 8 12 3 7 8"/>
                                <line x1="12" y1="3" x2="12" y2="15"/>
                            </svg>
                            <p>Click or drag to upload floor plan</p>
                            <span class="supported-formats">PNG, SVG, JPG</span>
                        </div>
                    </div>
                    <div class="uploaded-preview" id="uploadedPreview" style="display: none;">
                        <img id="previewImage" alt="Uploaded layout">
                        <button class="btn btn-small btn-secondary" id="clearUpload">Clear</button>
                    </div>
                </section>

                <!-- Apartment Type -->
                <section class="panel-section">
                    <h2>2. Apartment Type</h2>
                    <div class="radio-group">
                        <label class="radio-option">
                            <input type="radio" name="apartmentType" value="2bhk" checked>
                            <span class="radio-label">2 BHK</span>
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="apartmentType" value="3bhk">
                            <span class="radio-label">3 BHK</span>
                        </label>
                    </div>
                </section>

                <!-- Generate Initial Button -->
                <section class="panel-section">
                    <button class="btn btn-primary btn-full" id="generateBtn" disabled>
                        Generate 3D Model
                    </button>
                </section>

                <!-- Design Prompt -->
                <section class="panel-section" id="promptSection" style="display: none;">
                    <h2>3. Design with AI</h2>
                    <div class="prompt-input-group">
                        <textarea
                            id="promptInput"
                            placeholder="Describe your design changes...&#10;&#10;Examples:&#10;• Paint the living room walls blue&#10;• Add a TV unit in the living room&#10;• Replace the wardrobe in bedroom 1&#10;• Remove the coffee table"
                            rows="4"
                        ></textarea>
                        <button class="btn btn-primary" id="applyPromptBtn">
                            Apply Changes
                        </button>
                    </div>
                    <div class="prompt-suggestions">
                        <span class="suggestion" data-prompt="Paint the living room walls light blue">Blue walls</span>
                        <span class="suggestion" data-prompt="Add a modern TV unit in the living room">Add TV unit</span>
                        <span class="suggestion" data-prompt="Add a dining table in the kitchen">Dining table</span>
                        <span class="suggestion" data-prompt="Paint bedroom walls warm beige">Beige bedroom</span>
                    </div>
                </section>

                <!-- Action History -->
                <section class="panel-section" id="historySection" style="display: none;">
                    <h2>Changes Applied</h2>
                    <ul class="action-history" id="actionHistory"></ul>
                </section>
            </aside>

            <!-- Right Panel: 3D Viewer -->
            <div class="viewer-container">
                <div id="viewer3d" class="viewer">
                    <div class="viewer-placeholder" id="viewerPlaceholder">
                        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                            <path d="M2 17l10 5 10-5"/>
                            <path d="M2 12l10 5 10-5"/>
                        </svg>
                        <p>Upload a floor plan and click "Generate 3D Model" to begin</p>
                    </div>
                </div>

                <!-- Viewer Controls -->
                <div class="viewer-controls" id="viewerControls" style="display: none;">
                    <button class="control-btn" id="resetViewBtn" title="Reset View">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                            <path d="M3 3v5h5"/>
                        </svg>
                    </button>
                    <button class="control-btn" id="topViewBtn" title="Top View">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="18" height="18" rx="2"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                    <button class="control-btn" id="frontViewBtn" title="Front View">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="8" width="18" height="13" rx="1"/>
                            <path d="M7 8V6a5 5 0 0 1 10 0v2"/>
                        </svg>
                    </button>
                    <button class="control-btn" id="screenshotBtn" title="Take Screenshot">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="18" height="18" rx="2"/>
                            <circle cx="12" cy="13" r="4"/>
                            <path d="M5 3v2"/>
                            <path d="M19 3v2"/>
                        </svg>
                    </button>
                </div>
            </div>
        </main>

        <!-- Loading Overlay -->
        <div class="loading-overlay" id="loadingOverlay" style="display: none;">
            <div class="loading-spinner"></div>
            <p id="loadingText">Processing...</p>
        </div>

        <!-- Error Toast -->
        <div class="toast" id="errorToast" style="display: none;">
            <span class="toast-message" id="toastMessage"></span>
            <button class="toast-close" id="toastClose">&times;</button>
        </div>
    </div>

    <!-- Three.js and Dependencies -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module" src="src/app.js"></script>
</body>
</html>
